[project]
name = "dongdong-device"
version = "0.1.0"
description = "咚咚 Mac 设备端：灵矽语音 + code agent + AirPlay"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "mem0ai>=2.2.1,<3",
    "mcp>=1.20,<2",
    "opuslib>=3.0",
    "pyatv>=0.18,<0.19",
    "sounddevice>=0.5",
    "PyYAML>=6,<7",
    "uvicorn>=0.34",
    "websockets>=15",
    "zeroconf>=0.132",
]

[project.scripts]
dongdong = "dongdong.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dongdong"]

[tool.hatch.build]
artifacts = ["dongdong/static/**", "dongdong/vendor/birdview/**"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
