d catalog when valid. Keep scope and snapshot explicit, and only bind rules to modules after source inspection. Save the source catalog and reviewed selection alongside the compiled catalog so another AI can continue the review. If review is incomplete, report that boundary instead of claiming complete delivery. When no reviewed rules exist, deliver the architecture and discovery findings with the limitation; the rule renderer deliberately rejects an empty or unreviewed catalog.\n> \n> Use the bundled renderer, with absolute paths when running from the user's project; `\u003cskill-root>` contains SKILL.md. Substitute the actual agreed artifact paths:\n> \n> ```sh\n> node \u003cskill-root>/scripts/birdview.mjs deliver \u003cproject-root>/.birdview/architecture.json \u003cproject-root>/.birdview/architecture.html --catalog \u003cproject-root>/.birdview/constraints.catalog.json --rules \u003cproject-root>/.birdview/reviewed-rules.json --repo \u003cproject-root>\n> ```\n> \n> To reuse a valid compiled catalog, replace `--catalog ... --rules ...` with `--constraints \u003creviewed.json>`. Use `--architecture-only` instead only for an explicit architecture-only request or a disclosed unavailable rule catalog. Read the [delivery receipt](delivery.md), including warnings and history gaps; no separate successful-input validation, compilation or intermediate HTML is needed. Check that the final integrated page has Architecture / Constraints switching, source evidence, rule version labels and in-page source reading under By directory. The architecture inspector counts only map-bound rules, not the separate catalog; missing module links are not missing project rules.\n> \n> The renderer validates JSON and emits self-contained HTML requiring no server/network assets. Do not handcraft a substitute viewer or deliver a fictional demo as the project's map.\n> \n> Open HTML in a visible browser preview. With Codex `open_in_codex`, use a `browser` target and correctly encoded file URL, not a `file` target. A Markdown link may open source; a queued request does not confirm display, and headless inspection does not confirm the user's visible tab.\n> \n> Review the final HTML at the available user viewport:\n> \n> - Inspect Overview and All relations, names, relationships and selected-module evidence. Hover the module with most direct edges (incoming + outgoing, self-edge once), then other visibly congested areas.\n> - Check card-crossing/overlapping routes, congested turns, distinguishable endpoints/arrows, cropped routes/headings, hidden-relation counts and text size after fitting.\n> - Verify hover makes direct relationships traceable and leaving restores the selected view without moving nodes.\n> \n> Automatic spacing is not a readability guarantee. Keep pixel thresholds and invented congestion fields out of map data. If needed, adjust layout by responsibility/interaction order or groups by evidence; preserve identities, ownership, relationship semantics and full scope. Increment revision, rerender, and recheck affected areas and the full view. Stop after two consecutive attempts without visible improvement and report remaining issues. Unchanged maps in focused tasks need no unrelated UI audit.\n> \n> Report the actual artifact, viewport, modes, focused modules and unresolved issues. Schema checks, collision samples or screenshots alone are not visual acceptance; no automated crowding check is bundled. If browser inspection is unavailable/denied, state that visual review was not performed and the actual limitation; provide the absolute HTML path, explaining browser display versus editor source. Do not bypass denial or blame the template without rendering-error evidence.\n> \n> Lead with HTML and the preview result; include JSON path, `project.id`, `mapId`, `revision`, coverage and uncertainties as supporting information. Fix or report rendering blockers; JSON alone is not completed visual delivery. This is a snapshot, not live activity. Without a coding task, stop after delivery and ask for the intended change. With a coding task, prepare and render its scope through [Stage 2](show-changes.md), then wait for confirmation of the displayed plan before implementation. Rendering success alone is not permission to edit."},"directory-source-9":{"body":"# apps/device-mac/dongdong/vendor/birdview/references/show-changes.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Stage 2: Express the change\n> \n> [中文](show-changes.zh.md)\n> \n> Preparing the plan requires a user-requested task and the usable map from [Stage 1](map-project.md). Implementation additionally requires confirmation of the displayed plan, as defined in [SKILL.md](../SKILL.md).\n> Read [contract.md](contract.md), `schemas/activity.schema.json` and the example stream.\n> Use exact project/map/revision/module IDs; resolve stale coverage before emitting events. Never substitute a fictional map or infer IDs from prose.\n> \n> ## Record operations\n> \n> Before editing, follow [development.md](development.md) for the relevant task types. Include the intended observable behavior and verification method in the `planned` reason; use existing `checks` for executed results and `constraintReviews` for applicable recorded constraints. Do not add new event fields.\n> \n> 1. Before editing: append `planned` with complete `scope`, current `targets`, project-relative `files` and a short module-based reason. Render and deliver the plan, ask for confirmation, and wait. Do not treat the original coding request as approval of an unseen plan. Reuse confirmation already given for this same plan; honor an explicit task-specific waiver.\n> 2. After confirmation, before each edit group: append `editing` with concrete paths and only current modules as targets.\n> 3. Before checks: append `verifying`; test/fixture paths do not automatically count as modified files.\n> 4. At task end: append `completed`, `failed` or `cancelled`, recording actual commands, exit codes and observations in `checks` where applicable.\n> \n> Every JSONL event carries complete scope/targets. Explain scope expansion in a new `planned` event, update the preview and confirm the changed scope before editing added modules. For mapped edits, target all matching file owners; list unowned files in both `files` and `unmappedFiles`. Never invent ownership to pass validation; correct misleading rules in Stage 1.\n> \n> One active task per session; sequences start at 1 and stay contiguous. After a terminal event use a new task ID, never reopen one. Keep project and map revision fixed; new revisions require a new session/file. These are agent declarations: keep checks pending until executed, and never infer success from event emission or completion.\n> \n> ## Render and deliver\n> \n> ```sh\n> node \u003cskill-root>/scripts/birdview.mjs deliver \u003cmap.json> \u003cactivity.html> \u003cactivity.jsonl> --constraints \u003creviewed.json>\n> ```\n> \n> Reuse the matching reviewed catalog from Stage 1; do not repeat rule compilation for an activity update. For explicit architecture-only output or disclosed unavailable rules, replace `--constraints \u003creviewed.json>` with `--architecture-only`. The [delivery command](delivery.md) validates the map and full stream before replacing output; add `--bilingual` when applicable and use `--legacy` only for unchanged legacy classifications. Read its receipt and deliver only after success; follow Stage 1's preview checks.\n> \n> - Real activity opens at the latest record; simulation at the first plan. History and collapsible files/checks describe the selected step, not cumulative Git changes.\n> - Architecture/changes/comparison share positions; comparison links selection, zoom and scrolling and stacks on narrow screens.\n> - Scope stays outlined; non-targets dim. Planned targets highlight before edits, verification targets are labelled separately, and terminal events remove target glow. No executed checks means unverified.\n> - Use the separate `render.mjs --simulation` route only for fictional records such as `examples/harness.activity.jsonl`, never as observed work.\n> - For each supported activity language, supply event `translations[locale].reason` and check `translations[locale].summary`; absent translations fall back to originals.\n> - Updates need regeneration and refresh. No upload, auto-refresh, live interception or Git verification exists; a future display receipt would confirm rendering, not approval or correctness."},"directory-source-10":{"body":"# apps/device-mac/dongdong/vendor/birdview/references/development.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Development after activation\n> \n> [中文](development.zh.md)\n> \n> Apply only when Birdview is active and the user has authorized coding. Before implementation, follow the displayed-plan confirmation step in [SKILL.md](../SKILL.md); mapping or an initial coding request alone is not plan approval. Preserve the existing map and change workflow; these rules neither enable always-on behavior nor override project instructions.\n> \n> ## Choose the relevant guidance\n> \n> Read the related implementation, callers and applicable design decisions. Resolve questions from source first; ask only about unresolved choices that materially affect the task. Define the expected observable behavior and a proportionate way to verify it before editing. Combine the sections below when needed, such as bug diagnosis plus UI checks for a broken button. Do not run every section for every task.\n> \n> ### Bug fixes\n> \n> Establish a reproduction or inspect concrete failure evidence matching the reported symptom. Use the smallest useful test, command, request or UI interaction. For intermittent failures, record reproduction conditions and frequency. If reproduction is unavailable, state what was tried and what evidence is missing; distinguish a tentative fix from a verified one.\n> \n> Test plausible causes against evidence before choosing a fix. Multiple competing hypotheses help ambiguous failures, but simple bugs need no fixed hypothesis count. Change one relevant variable at a time when investigating. For performance work, measure the affected scenario before and after under comparable conditions.\n> \n> After fixing, rerun the original scenario. Add a regression test when it can exercise the real failure path and provides durable value; observe it fail before the fix and pass afterward when feasible. Explain missing coverage. Remove temporary instrumentation introduced for this task without deleting others' work.\n> \n> ### Features and behavior changes\n> \n> Identify observable acceptance behavior and important failure paths. Implement and verify in small behavior-sized steps. Tests should exercise real paths through stable interfaces, rather than mirror private implementation or pass only because internal collaborators are mocked. Use test-first development when requested or useful; do not mandate it for every change or add tests for trivial, reversible edits without meaningful risk.\n> \n> ### Refactoring and architecture changes\n> \n> Inspect affected callers, compatibility requirements and existing decisions. State the concrete benefit, such as removing duplicated business rules or reducing knowledge required by callers. Preserve behavior unless its change is authorized, and verify the interfaces and paths affected. Do not add speculative abstractions or expand into unrelated cleanup. Ordinary edits do not start an architecture review; use the separate review workflow only when requested under the skill's activation rules.\n> \n> ### UI changes\n> \n> Inspect the rendered result and affected interaction at relevant viewport sizes. Check loading, empty and error states where affected, plus relevant keyboard operation, focus and accessible labels. Scale checks to the change: a copy edit does not require a full-site audit. When visual or interaction verification is unavailable, state the limitation instead of claiming acceptance.\n> \n> ## Record and finish\n> \n> Use the existing [change workflow](show-changes.md): put the expected behavior and intended verification in the `planned` reason, actual commands, exit codes and observations in `checks`, and reviews of applicable recorded constraints in `constraintReviews`. Do not invent schema fields or passing results. A manual review supports only the inspected scope, and completing an activity does not establish correctness.\n> \n> Distinguish checks not run, environment blockers and observed failures. Continue routine checks and justified retries autonomously; ask only for material unresolved choices or required access. After relevant checks pass, broaden testing only for changed scope or remaining risk. Recheck the original request, update the map if responsibilities, ownership or relationships changed, and report the changes, actual verification and remaining limits. These are agent instructions; validators check records, not whether the agent truly followed the process."},"directory-source-11":{"body":"# apps/device-mac/dongdong/vendor/birdview/references/contract.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Birdview contract v0.1\n> \n> [中文](contract.zh.md)\n> \n> ## Multi-agent collaboration\n> \n> Activity events may include `occurredAt` (an ISO 8601 timestamp), `gitCommit` (the source commit), and `collaboration: { agent, locks }`. `agent` identifies the worker and `locks` lists file paths or stable module IDs claimed for the active task. The validator warns when active claims from different agents overlap. A terminal event releases claims for that task, so completed collaboration state does not remain active. These are trace and conflict signals, not filesystem locks or merge replacements.\n> \n> ## Architecture\n> \n> Optional module `role` classifies responsibility as `frontend`, `backend`,\n> `cache`, `database`, `queue`, `security`, or `generic`. Missing roles render as\n> `generic`, preserving older maps. Role determines the viewer's icon and color\n> family, independently of `kind` and group membership. Cache uses cyan with a\n> lightning icon; database uses violet with a database icon. Roles are not activity states.\n> \n> New maps must pass authoring validation (`validate.mjs --authoring`, `requireRoles: true` in the API, or the default in [deliver](delivery.md)): every module declares `role`, and `generic` requires `roleAssessment: { basis, note }`. Use `basis: \"out-of-taxonomy\"` when inspected responsibilities fit no listed role, or `\"insufficient-evidence\"` when classification lacks evidence; the latter requires `status: \"uncertain\"` and a specific `openQuestions` entry. `note` explains the decision with reference to the module's evidence or missing inspection. Its translations belong in `roleAssessment.translations.\u003clocale>.note`; `basis` is never translated. Assessments are only valid on explicit generic modules.\n> \n> Default validation/rendering keeps legacy maps without roles or assessments valid. An all-generic/unclassified map returns `role/all-generic-review` in validator `warnings`, even if valid: review each module and explain the outcome at delivery. This warning is not a color-diversity requirement. Validation checks declarations, not the truth of classifications or the quality of explanations.\n> \n> Optional `groups` represent authored system/subsystem membership, not deployment\n> or trust boundaries. Each has a unique `id`, `name`, nonempty source `evidence`\n> and unique module IDs in `members`. Groups are disjoint and one level deep.\n> Unknown members and duplicate memberships are rejected. Group translations cover\n> the name and evidence notes. The viewer arranges groups side by side, retaining\n> relative row/column order inside each group; ungrouped nodes remain unframed.\n> \n> Optional group `role` assigns a fixed semantic color: `interaction` (pale blue,\n> user interaction/review), `runtime` (pale amber, execution/orchestration),\n> `external-services` (pale violet, integrations outside the described system), or\n> `generic` (neutral gray, unspecified grouping). Missing roles use `generic`.\n> Roles are authored from evidence, never inferred from order, names, or module\n> ownership. They do not assert deployment/trust boundaries or change activity.\n> The group heading displays the localized role alongside its name.\n> \n> Optional `language` (such as `zh`, `en`, `ja`, `fr` or `pt-BR`) identifies the base\n> text language using a common language tag. Optional\n> `translations` on project, modules, relationships and evidence objects contains\n> localized text only. See [bilingual.md](bilingual.md) for authoring and completeness validation.\n> Absent translations fall back to base fields; identities and layout are shared.\n> \n> `schemaVersion` versions the file format. `mapId` identifies a map and `revision`\n> versions its contents. Together with `project.id`, these bind activity to the\n> intended system. Revision numbers are author-maintained; they are not a content\n> hash. Consumer-side hashing may be introduced with a real live transport.\n> \n> `modules` describe responsibilities. `ownership` assigns exact files or directory\n> prefixes. `evidence` explains which source locations support the description.\n> One evidence citation does not imply ownership of that file. `relationships`\n> describe authored directed connections, not runtime impact analysis.\n> \n> Paths use forward slashes and stay relative to the project root. Empty segments,\n> dot/parent segments, drive letters and `.git` segments are forbidden. A directory\n> rule such as `src/api` matches `src/api/products.ts`, not `src/api-other.ts`.\n> Multiple matching owners are allowed and must be represented explicitly.\n> External modules have no ownership and can use an empty evidence list; local\n> modules require ownership and evidence. Uncertain modules/relationships require\n> nonempty `openQuestions`.\n> \n> The schema is strict about fields. Semantic validation additionally checks unique\n> IDs, existing relationship endpoints, distinct grid cells, evidence line order,\n> and the local/external and uncertainty rules. It does not read project source.\n> \n> ## Activity\n> \n> Each JSONL line is a complete event. Its `scope` is the overall declared task\n> scope; `targets` is the current subset. `files` is the current step's concrete\n> file list. For `planned`/`editing`, every mapped owner must be in `targets`.\n> Unmapped paths must be reported exactly in `unmappedFiles` for every phase.\n> \n> `checks` contains command, nullable exit code and `passed|failed|not-run` status.\n> Passed requires exit code 0, failed requires a nonzero exit code, and not-run\n> requires null. No checks means no verification claim. `completed` can describe\n> an untested change, but cannot include a failed check. A `failed` event may have\n> no checks when failure occurred before verification.\n> \n> Session rules:\n> \n> - The first event has sequence 1; following sequences are contiguous.\n> - A session belongs to one project and map revision.\n> - A new task begins with `planned`; only one task is active at a time.\n> - Active tasks accept `planned`, `editing`, `verifying`, or a terminal event.\n> - `planned` can revise scope. Every other event preserves the latest plan scope.\n> - Terminal phases are `completed`, `failed`, `cancelled`; task IDs cannot reopen.\n> - Targets must belong to scope. Terminal events may have empty targets.\n> \n> These are authoring consistency rules, not enforcement of coding permissions.\n> The validator reports an error code and location; an invalid input is never\n> silently repaired. Neither contract defines HTTP endpoints, ports, UI colors or\n> an automatic interception mechanism.\n> \n> ## Visual contract\n> \n> Optional local-constraint discovery, rule scope, applicability and per-event verification records follow [Effective constraints](constraints.md). They preserve legacy map/event compatibility and never establish automatic enforcement.\n> \n> Every relationship requires `kind` and `visibility`. `kind` is `request` (invoke\n> an operation), `result` (return its outcome), `dependency` (use a capability or\n> resource), `event` (publish a notification/state record), or `control` (schedule,\n> approve, cancel or otherwise govern execution). These describe the authored arrow;\n> they do not prove synchronous execution or imply an unrecorded reverse edge.\n> `visibility` is `overview` or `detail`. Overview initially displays only\n> `overview` relationships; All displays every relationship. Missing fields and\n> the removed `primary` field are invalid; no legacy fallback is supported.\n> All modules keep their positions and stay\n> available. Hover temporarily reveals every direct relationship of that module,\n> including auxiliary ones, and dims unrelated context. The visible/total count\n> reflects this reveal. This is a reading aid, never an activity scope or new edge.\n> \n> Render modules at stable grid positions; preserve them across activity updates.\n> Use a persistent outline for planned scope, highest emphasis for current targets,\n> and reduced emphasis for unrelated modules. Keep module names readable. Display\n> planned-event targets with the same emphasis before editing starts. Verification\n> targets must be identified as verification, not editing. Comparison panes share\n> positions and navigation, with activity emphasis only on the changes pane.\n> Display\n> reason and phase outside the map and reveal files/evidence on module selection.\n> Never imply that all neighbors of a target are being modified. Keep simulation\n> explicitly labelled and separate from real activity."},"directory-source-12":{"body":"# apps/device-mac/dongdong/vendor/birdview/references/bilingual.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Architecture language selection\n> \n> [中文](bilingual.zh.md)\n> \n> ## Select and author\n> \n> Resolve the delivery language without asking or pausing: explicit output instructions/applicable standing preference, then dominant request prose (ignore code IDs and quoted source). For language-neutral requests, use recent conversation, existing map language, then English. Browser locale and saved UI preferences do not decide authored language.\n> \n> Support any language. Set `language` to the base language tag; single-language maps need no translations. For multiple languages, use the preferred/first-listed language as base and put others in each text-owning object's `translations.\u003clanguage-tag>`. Reuse existing structure, base language and translations; add complete missing delivery translations. Infer an absent base tag from prose, using the delivery language if ambiguous. Saved translation changes increment map revision and respect active task bindings.\n> \n> Describe the same inspected architecture in all languages:\n> \n> - Translate project/group/module names, responsibilities, relationship labels, evidence notes and nonempty `openQuestions`; preserve question order and uncertainty.\n> - Keep names short and responsibilities suitable for two lines, with full text in details. Preserve proper names, IDs, paths, symbols, line numbers, enums and layout.\n> - Use one map; do not invent evidence or remove existing translations unprompted. See [the complete example](../examples/bilingual.architecture.json).\n> - For multilingual activity, translate every supported language's event `translations[locale].reason` and check `translations[locale].summary`; missing values fall back to original text.\n> \n> ## Validate and display\n> \n> ```sh\n> node \u003cskill-root>/scripts/birdview.mjs deliver \u003cmap.json> \u003carchitecture.html> --constraints \u003creviewed.json> --bilingual\n> ```\n> \n> For newly reviewed rules, use the compilation route in [delivery.md](delivery.md); for explicit architecture-only output, replace `--constraints \u003creviewed.json>` with `--architecture-only`. The command includes authoring and bilingual validation. Standalone `validate.mjs --bilingual` remains useful for diagnosis, not a required extra round trip.\n> \n> Use `--bilingual` for Chinese/English delivery only. Single-language maps validate without it; other combinations require manual language-coverage review after structural validation. The strict check verifies architecture text coverage and question counts, not translation accuracy or activity translations. Do not claim complete Chinese/English coverage before it passes; inspect both languages' tooltips, details and relationships in the browser, and check activity coverage separately.\n> \n> Open HTML with `#lang=\u003cdelivery-language-tag>`. Display priority is supported URL language, saved preference, then map base (legacy default: Chinese). Switching preserves selection, layout and zoom; missing translations use base text. The selector does not translate content or call a translation API.\n> \n> UI controls are bundled only in Chinese/English; other languages use English controls with authored project text. Do not claim fully localized UI for them. Right-to-left content is supported, but graph/toolbar layout remains left-to-right."},"directory-source-13":{"body":"# apps/device-mac/dongdong/vendor/birdview/references/delivery.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Deliver a map\n> \n> [中文](delivery.zh.md)\n> \n> After inspecting source and authoring the architecture and reviewed rules, use one command for strict validation, rule compilation, Git line history and integrated rendering. Paths below are relative to the installed skill; use absolute script paths from another directory. Node.js and installed skill dependencies are required; compilation with history also requires Git and the source repository.\n> \n> ```sh\n> node scripts/birdview.mjs deliver architecture.json project.html --catalog constraints.catalog.json --rules reviewed-rules.json --repo /path/to/repository\n> ```\n> \n> This writes `project.html` and `project.constraints.json`. Keep the original source catalog and reviewed selection too. Source collection and AI semantic review happen **before** this command; it does not infer rules or confirm coverage. A separate source-only or standalone constraint HTML is unnecessary for integrated delivery; source text is readable in By directory within the integrated page.\n> \n> Choose exactly one route:\n> \n> | Route | Arguments | Outputs |\n> | --- | --- | --- |\n> | Compile reviewed selection | `--catalog sources.json --rules reviewed-rules.json --repo root` | Integrated HTML, compiled catalog with history |\n> | Reuse matching reviewed catalog | `--constraints project.constraints.json` | Integrated HTML |\n> | Explicit architecture-only or disclosed missing rules | `--architecture-only` | Architecture HTML |\n> \n> Reuse does not refresh rule history; inspect scope, snapshot and bindings before reusing. `--repo root` is optional for reuse and architecture-only and enables the existing map-constraint freshness check; it does not prove the whole map is current. An unavailable rule catalog must remain a stated limitation, not a claim of complete default delivery.\n> \n> An optional activity JSONL follows the two positional paths:\n> \n> ```sh\n> node scripts/birdview.mjs deliver architecture.json activity.html activity.jsonl --constraints project.constraints.json\n> ```\n> \n> The full activity stream is validated against the map. Do not recompile unchanged constraints just to update activity. Fictional simulation keeps the existing `render.mjs --simulation` route.\n> \n> ## Validation and result\n> \n> - Strict authoring validation is on by default (equivalent to `validate.mjs --authoring`). Add `--bilingual` for Chinese/English delivery. Fix failures; review warnings against source. Do not rerun a separate validator on unchanged input just to follow an old checklist.\n> - Use `--legacy` only when updating a genuine existing map with unchanged legacy role fields. It relaxes only the explicit-role authoring check, not schema, event, translation or binding checks. Inspect new/changed classifications yourself; never use it to bypass a new-map failure.\n> - The renderer retains its internal defensive validation. This command reduces agent/tool handoffs; it does not promise a single internal validation pass or a measured token/speed improvement.\n> - stdout is a JSON receipt. `ok: true` and exit code 0 mean artifact generation succeeded. Failures return exit code 1, the failing `stage`, validation diagnostics or `error`; `written` lists paths already published. Preserve warnings and `constraints.historyGaps` in the user-facing explanation, in the conversation language.\n> - Every artifact is validated/rendered in memory before writes. Input/output aliases are rejected. Temporary sibling files are prepared before publication, with the main HTML last. An I/O failure during publication can leave some sidecars updated; multiple file replacements are not a transaction. Inspect `written` before retrying.\n> \n> `visualReview: not-performed` and `implementationVerification: unverified` are deliberate. Open the final page and do [visual review](map-project.md); explain scope and uncertainty, and follow the [displayed-plan confirmation rule](../SKILL.md) before implementation. Rendering success is neither acceptance nor permission to edit. Standalone validation, compilation and rendering commands remain available for diagnosis and explicit constraint-only tasks."},"directory-source-14":{"body":"# apps/device-mac/dongdong/vendor/birdview/references/review-contract.md\n\n类型：reference\n\n记录作用域：按任务与引用判断\n\n来源审查状态：unreviewed\n\n尚未提炼规则；不代表不存在约束。\n\n## 原文 / Source\n\n> # Architecture review contract\n> \n> [中文](review-contract.zh.md)\n> \n> Canonical schema: [review.schema.json](../schemas/review.schema.json), generated from src/contracts/models.mts. Example: [review.json](../examples/review.json). Render with scripts/render-review.mjs; add `--repo \u003crepository-root>` to check every source quote.\n> \n> The review page is an annotated drawing: ink draws source facts, red pencil marks review judgments. Authors write only facts and judgments. Red-pencil loops, connectors, numbering, the title block, the seal and the caller-knowledge counts are derived by the renderer from the fields; data never carries coordinates or styling.\n> \n> ## Shape at a glance\n> \n> Field names and types; limits are in the sections below. Ids match `^[a-z][a-z0-9-]{0,63}$`. Text fields are strings and lists of text are string arrays. `evidence` on nodes and findings holds zero-based indexes into the same candidate's `evidence` list. Rows and columns are zero-based grid cells; empty leading rows and columns are dropped when drawing.\n> \n> ```text\n> { schemaVersion: \"2\", project, revision: string, sourceRevision, workingTree: { dirty: [path] },\n>   baseline?, sources: [{ path, kind }], architectureBinding?: { mapId, revision: integer },\n>   scope, gaps: [text], language, recommendation: null | { candidate: candidateId, reason },\n>   candidates: [{ id, title, lede, impact, strength, dependency, modules: [moduleId],\n>     before: Diagram, after: Diagram,\n>     findings: [{ id, kind, note, detail, targets: [nodeId], evidence: [index], confidence }],\n>     callerKnowledge: { before: [text], after: [text] },\n>     solution, deletionTest: { verdict, text }, wins: [{ kind, text }],\n>     verification: [text], boundaries: [text], cost, adrConflict?: { path, reason },\n>     evidence: [{ path, lines: { start, end }, symbol?, quote, note }] }] }\n> Diagram = { nodes: [{ id, label, kind, row, column, span?, modules: [moduleId], evidence: [index], absorbs?: [nodeId] }],\n>             edges: [{ from, to, label? }], seams?: [{ label, below: nodeId }], caption }\n> ```\n> \n> ## Report\n> \n> - schemaVersion is \"2\"; project is the actual project name; revision identifies this review; sourceRevision records the inspected commit.\n> - workingTree.dirty lists relevant uncommitted files at inspection time (project-relative, may be empty). Optional baseline explains unfinished earlier changes and what this round treats as the current state.\n> - sources lists the glossaries, decision records, rules and documents read (kind glossary, adr, rule or doc); record missing ones in gaps. scope states what was inspected, gaps the known gaps.\n> - language is zh or en and controls only interface text; content is not translated.\n> - candidates may be empty, at most 6, ordered by expected value. recommendation is null or {candidate, reason}; recommend only when evidence supports it.\n> - For `--review` integration, architectureBinding must match {mapId, revision}, and candidate and node modules must be existing map module IDs. Standalone rendering needs no binding.\n> \n> ## Candidate\n> \n> - **Heading**: title (at most 28 characters, business consequence first), lede (at most 160), impact (business impact, at most 200). strength is strong, worth-exploring or speculative and states recommendation strength; dependency is in-process, local-substitutable, ports-adapters or external and decides how it is tested.\n> - **Current drawing before and clean redraw after**: each a small graph of at most 12 nodes and 24 edges.\n>   - Node: {id, label, kind, row, column, span?, modules, evidence}. kind is caller, module, step or external; deep appears only in the redraw and must list, in absorbs (at most 6), the current nodes it takes over; when the deepened module grows out of an existing node, reuse that node's id instead of absorbing it. span lets a node cover several columns; covered cells must not overlap.\n>   - The same thing keeps the same id in both drawings, so the renderer links them. Current module and step nodes need evidence.\n>   - edges are {from, to, label?}; seams are {label, below} and draw a dotted seam under the named node.\n>   - caption is the drawing's caption: the current business consequence under before, the expected result under after.\n> - **Red-pencil findings**: 1 to 6, each one red mark on the current drawing. {id, kind, note, detail, targets, evidence, confidence}.\n>   - kind selects the mark: duplicate loops every target and joins them; leak loops and draws the leak direction; shallow strikes through; ordering adds a wavy underline; missing-seam draws a dashed line between targets.\n>   - note is the handwritten note on the drawing, at most 16 characters; detail is the explanation below it; targets name current nodes; confidence is observed or hypothesis, per finding.\n>   - A strong candidate needs at least one observed finding.\n> - **Caller knowledge**: callerKnowledge.before and .after, short lines (at most 14 characters, at most 6 each) shown as handwritten margin notes; together they show the interface width. after may be empty.\n> - **Argument**: solution (one sentence), deletionTest (verdict keep, remove or narrow, plus text), wins (1 to 4; kind locality, leverage, depth, seam or testability), verification (behaviour checked through the interface, at least 1), boundaries (what does not change), cost (migration cost and risk), optional adrConflict (path and reason when the proposal contradicts a recorded decision).\n> - **Evidence**: 1 to 12 entries {path, lines: {start, end}, symbol?, quote, note}. quote is the exact text of the cited lines; its line count must match the range, at most 41 lines. note is the handwritten comment under the clipping.\n> \n> ## Validation\n> \n> Structural validation rejects: duplicate ids; overlapping node cells; edges, seams, findings or absorbs naming unknown nodes; invalid evidence indexes; deep, or module and step nodes without evidence, in the current drawing; a recommendation naming an unknown candidate; paths that are not project-relative; text longer than its slot.\n> \n> `--repo` checks source quotes line by line, ignoring trailing whitespace: a quote passes if it matches the file at sourceRevision or, failing that, the working tree, so uncommitted code under review can be cited (list such files in workingTree.dirty). Any mismatch or missing file is an error and no page is written. Without `--repo` the page still renders, but quotes are marked as not checked. Neither check judges whether the business conclusions are right.\n> \n> Output is offline HTML showing the generator, review and source revisions. Hovering a node highlights the node with the same id in both drawings; multiple candidates switch by sheet number. The page infers no approval or implementation status and runs no external scripts."}}},"snapshot":"378f453cb7391482cc2b7610876465b825623c91","scope":"完整审阅根 AGENTS.md 的项目约束，另提炼 docs/decisions.md 中与当前运行边界相关的9条决策；历史过程与 vendor 内技能引用不视为全项目有效规则。vendor 来源仅收集未逐条语义审阅，两个缺失链接保留。当前用户补充和未跟踪本地 Birdview 已单独阅读，不伪造 committed HEAD 历史；不声称全环境规则全集或全部实现合规。","rules":[{"id":"no-abstraction","modules":[]},{"id":"delete-first","modules":[]},{"id":"file-limit","modules":[]},{"id":"callers-first","modules":[]},{"id":"no-guess","modules":[]},{"id":"happy-path","modules":[]},{"id":"no-extra-tests","modules":[]},{"id":"protocol-tests","modules":[]},{"id":"audio-tests","modules":[]},{"id":"execution-tests","modules":[]},{"id":"auth-tests","modules":[]},{"id":"test-prohibitions","modules":[]},{"id":"no-tdd","modules":[]},{"id":"smoke-contract","modules":[]},{"id":"dependency-order","modules":[]},{"id":"no-reinvention","modules":[]},{"id":"platform-exception","modules":[]},{"id":"large-dependency","modules":[]},{"id":"declare-dependency","modules":[]},{"id":"directory-duty","modules":[]},{"id":"temporary","modules":[]},{"id":"commit-progress","modules":[]},{"id":"commit-prefix","modules":[]},{"id":"atomic-commit","modules":[]},{"id":"check-before-commit","modules":[]},{"id":"rebase-before-push","modules":[]},{"id":"no-secrets","modules":[]},{"id":"python-style","modules":[]},{"id":"typing","modules":[]},{"id":"comments","modules":[]},{"id":"logging","modules":[]},{"id":"blacklist","modules":[]},{"id":"pitfall-log","modules":[]},{"id":"shell-not-sandbox","modules":["runtime","capabilities","device-tools"]},{"id":"kill-group","modules":[]},{"id":"meeting-confirm","modules":["meeting"]},{"id":"scope-audit","modules":[]},{"id":"outbound-mcp","modules":[]},{"id":"restart-pause","modules":["scheduler","storage"]},{"id":"session-isolation","modules":["host","scheduler","meeting"]},{"id":"story-export","modules":["story"]},{"id":"vendor-limit","modules":[]}]}};
